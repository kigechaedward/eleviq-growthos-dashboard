<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BusinessOS — Command Center Concepts</title>
<style>
:root{
  color-scheme:dark;
  --eleviq-bg:#0B0D12; --eleviq-surface:#14171F; --eleviq-surface-2:#1A1E28;
  --eleviq-surface-glass:rgba(20,23,31,0.72);
  --eleviq-primary:#8B6DF5; --eleviq-primary-soft:rgba(139,109,245,0.16);
  --eleviq-text:#E7E9F0; --eleviq-text-secondary:#9AA1B5; --eleviq-text-muted:#6E7487;
  --eleviq-border:#262B38; --eleviq-border-soft:rgba(38,43,56,0.5);
  --eleviq-success:#4ADE80; --eleviq-warning:#FBBF24; --eleviq-danger:#F87171; --eleviq-info:#60A5FA;
  --eleviq-track:rgba(231,233,240,0.16);
  --rail-bg:rgba(20,23,31,0.5);
  --accent-command:#6C4CF1; --accent-strategy:#7C3AED; --accent-marketing:#EC4899; --accent-sales:#14B8A6;
  --accent-finance:#0EA5E9; --accent-ops:#F59E0B; --accent-customer:#8B5CF6; --accent-product:#22D3EE;
  --accent-intel:#A3E635; --accent-support:#FB923C;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-full:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px;
  --ease:cubic-bezier(0.2,0,0,1); --ease-out:cubic-bezier(0,0,0.2,1); --ease-exit:cubic-bezier(0.4,0,1,1);
  --motion-fast:120ms; --motion-base:200ms; --motion-slow:320ms;
  --elev-1:0 1px 2px rgba(0,0,0,0.4); --elev-2:0 4px 16px rgba(0,0,0,0.5); --elev-3:0 12px 32px rgba(0,0,0,0.6);
  --font-ui:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="light"]{
  color-scheme:light;
  --eleviq-bg:#F7F8FA; --eleviq-surface:#FFFFFF; --eleviq-surface-2:#FFFFFF;
  --eleviq-surface-glass:rgba(255,255,255,0.72);
  --eleviq-primary:#6C4CF1; --eleviq-primary-soft:rgba(108,76,241,0.12);
  --eleviq-text:#1A1D26; --eleviq-text-secondary:#5B6172; --eleviq-text-muted:#8A90A0;
  --eleviq-border:#E4E6EE; --eleviq-border-soft:rgba(228,230,238,0.8);
  --eleviq-success:#16A34A; --eleviq-warning:#D97706; --eleviq-danger:#DC2626; --eleviq-info:#2563EB;
  --eleviq-track:rgba(26,29,38,0.08);
  --rail-bg:rgba(245,246,250,0.6);
  --elev-1:0 1px 2px rgba(15,17,23,0.06); --elev-2:0 2px 8px rgba(15,17,23,0.10); --elev-3:0 8px 24px rgba(15,17,23,0.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui); font-size:15px; line-height:1.5; color:var(--eleviq-text);
  background:var(--eleviq-bg); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
#stage{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--eleviq-text-muted);flex:none}
.dot.succ{background:var(--eleviq-success)}
.dot.warn{background:var(--eleviq-warning)}
.dot.dang{background:var(--eleviq-danger)}
.dot.idle{background:var(--eleviq-text-muted)}
.monochip{font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:var(--radius-full);background:var(--eleviq-surface-2);border:1px solid var(--eleviq-border);color:var(--eleviq-text-secondary)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);background:var(--eleviq-warning);color:#1A1202;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:transform var(--motion-fast) var(--ease-out),background var(--motion-base) var(--ease-out),box-shadow var(--motion-base) var(--ease-out)}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--eleviq-primary);color:#fff}
.btn-primary:hover{background:#9C7FF7;box-shadow:0 0 0 3px var(--eleviq-primary-soft)}
.btn-ghost{background:var(--eleviq-surface-2);border:1px solid var(--eleviq-border);color:var(--eleviq-text-secondary)}
.btn-ghost:hover{color:var(--eleviq-text);border-color:#333A4C}
.btn-mini{padding:4px 10px;font-size:12px}
.card{background:var(--eleviq-surface);border:1px solid var(--eleviq-border);border-radius:var(--radius-md);box-shadow:var(--elev-1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.rv{opacity:0;animation:fadeUp var(--motion-slow) var(--ease) forwards;animation-delay:var(--d,0s)}
.side{
  background:var(--eleviq-surface-glass); backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-right:1px solid var(--eleviq-border-soft); display:flex; flex-direction:column; height:100vh;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;border-bottom:1px solid var(--eleviq-border)}
.side-brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#8B6DF5,#22D3EE);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.side-brand b{font-size:14px;letter-spacing:.2px}
.side-nav{flex:1;overflow:auto;padding:14px 10px 20px}
.navgroup{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--eleviq-text-muted);padding:14px 10px 6px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;color:var(--eleviq-text-secondary);position:relative;transition:background var(--motion-base) var(--ease-out),color var(--motion-base) var(--ease-out)}
.navitem:hover{background:var(--eleviq-primary-soft);color:var(--eleviq-text)}
.navitem[data-active]{background:var(--eleviq-primary-soft);color:var(--eleviq-text);font-weight:600}
.navitem[data-active]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--eleviq-primary)}
.navitem .nicon{width:16px;text-align:center;font-size:14px;flex:none}
.navitem .grow{flex:1}
.side-foot{padding:12px 14px;border-top:1px solid var(--eleviq-border);font-size:12px;color:var(--eleviq-text-muted);display:flex;align-items:center;gap:8px}
.userchip{width:26px;height:26px;border-radius:var(--radius-full);background:var(--accent-command);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.topbar{
  display:flex;align-items:center;gap:12px;padding:12px 22px;height:60px;
  background:var(--eleviq-surface-glass); backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--eleviq-border-soft); position:sticky; top:0; z-index:20;
}
.projchip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:var(--radius-full);border:1px solid var(--eleviq-border);background:var(--eleviq-surface-2);font-size:12.5px;font-weight:600;color:var(--eleviq-text)}
.projchip .dot{width:7px;height:7px}
.crumb{font-size:13px;color:var(--eleviq-text-muted)}
.crumb b{color:var(--eleviq-text-secondary);font-weight:600}
.cmdbar{flex:1;display:flex;align-items:center;gap:8px;max-width:420px;margin-left:8px;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--eleviq-border);background:var(--eleviq-surface-2);color:var(--eleviq-text-muted);font-size:13px;cursor:pointer;transition:border-color var(--motion-base) var(--ease-out),box-shadow var(--motion-base) var(--ease-out)}
.cmdbar:hover{border-color:var(--eleviq-primary);box-shadow:0 0 0 3px var(--eleviq-primary-soft)}
.cmdbar .kbd{margin-left:auto;font-family:var(--font-mono);font-size:11px;border:1px solid var(--eleviq-border);border-radius:4px;padding:1px 5px}
.topicon{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--eleviq-text-secondary);position:relative;transition:background var(--motion-base) var(--ease-out),color var(--motion-base) var(--ease-out)}
.topicon:hover{background:var(--eleviq-surface-2);color:var(--eleviq-text)}
.topicon .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;font-size:10px}
@media (max-width:1024px){
  .navitem .nlabel,.navgroup,.side-brand b,.side-foot span:last-child{display:none}
  .navitem{justify-content:center}.navitem .nicon{margin:0}
  .v-exec{grid-template-columns:60px minmax(0,1fr)}
  .v-org{grid-template-columns:60px minmax(0,1fr);height:auto;min-height:100vh;overflow:visible}
  .v-mission{grid-template-columns:60px minmax(0,1fr);height:auto;min-height:100vh;overflow:visible}
  .v-org .o-main{overflow-x:hidden}
  .v-mission .m-main{overflow-x:hidden}
  .v-org .o-rail{grid-column:2;border-left:0;border-top:1px solid var(--eleviq-border-soft)}
  .v-mission .m-rail{grid-column:2;border-left:0;border-top:1px solid var(--eleviq-border-soft)}
}
@media (max-width:768px){
  .v-org{grid-template-columns:1fr;padding-bottom:64px}
  .v-org .side{display:none}
  .v-org .o-main{grid-column:1;padding:16px 16px 40px}
  .v-org .o-rail{grid-column:1;border-top:1px solid var(--eleviq-border-soft)}
  .v-org .org-depts{grid-template-columns:repeat(2,1fr)}
  .v-org .org-expanded{grid-template-columns:1fr}
  .v-org .cmdbar,.v-org .crumb{display:none}
  .v-org .agent-panel{width:100%;left:0;right:0;border-left:0;border-top:1px solid var(--eleviq-border)}
  .v-org .o-hero{flex-direction:column;align-items:flex-start;gap:10px}
  .v-org .org{padding:14px}
  .v-exec .x-kpis,.v-exec .x-cols{grid-template-columns:1fr}
  .v-exec .x-rail{position:static}
  .bottom-tabs{display:flex}
}
@media (max-width:480px){
  .v-org .org-depts{grid-template-columns:1fr}
  .o-hero h1{font-size:1.25rem}
  .x-head h1{font-size:1.4rem}
}
.bottom-tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;align-items:center;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--eleviq-surface-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--eleviq-border-soft)}
.bottom-tabs .bt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 12px;border-radius:10px;font-size:10px;font-weight:600;color:var(--eleviq-text-muted)}
.bottom-tabs .bt[data-active]{color:var(--eleviq-primary);background:var(--eleviq-primary-soft)}
.proto-theme{position:fixed;top:16px;right:16px;z-index:2147483646;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);color:rgba(255,255,255,0.7);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;line-height:1;cursor:pointer;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12)}
.proto-theme:hover{color:#fff}
.proto-theme:active{transform:scale(0.97)}
.proto-theme:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
}

/* ============ VARIANT 1 — EXECUTIVE ============ */
.v-exec{display:grid;grid-template-columns:228px 1fr;height:100vh;overflow:hidden}
.v-exec .side{grid-column:1}
.v-exec .x-main{grid-column:2;display:flex;flex-direction:column;min-width:0}
.v-exec .x-body{padding:22px 26px 40px;overflow-y:auto}
.x-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.x-head h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em}
.x-head p{margin-top:4px;font-size:13.5px;color:var(--eleviq-text-secondary);max-width:620px}
.x-head .date{font-size:12px;color:var(--eleviq-text-muted);white-space:nowrap}
.x-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px;cursor:pointer;transition:transform var(--motion-fast) var(--ease-out),border-color var(--motion-base) var(--ease-out),box-shadow var(--motion-base) var(--ease-out)}
.kpi:hover{transform:translateY(-2px);border-color:#333A4C;box-shadow:var(--elev-2)}
.kpi .lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--eleviq-text-muted)}
.kpi .val{font-size:1.625rem;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.kpi .val .mono{font-size:1.3rem}
.kpi .delt{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.kpi .delt.up{color:var(--eleviq-success)}
.kpi .delt.warn{color:var(--eleviq-warning)}
.kpi .spark{margin-top:10px;height:26px}
.kpi[data-tag]{position:relative}
.kpi[data-tag]::after{content:attr(data-tag);position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;color:var(--eleviq-warning);border:1px solid rgba(251,191,36,.4);padding:2px 7px;border-radius:var(--radius-full)}
.x-cols{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:18px;align-items:start}
.x-sec{margin-bottom:22px}
.x-sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--eleviq-text-secondary);margin-bottom:10px}
.att{display:flex;flex-direction:column;gap:8px}
.att-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);background:var(--eleviq-surface);border:1px solid var(--eleviq-border);font-size:13.5px;transition:border-color var(--motion-base) var(--ease-out),background var(--motion-base) var(--ease-out)}
.att-row:hover{border-color:#333A4C}
.att-row.resolved{opacity:.35;filter:grayscale(.6)}
.att-row.resolved .t::after{content:"  ·  resolved";color:var(--eleviq-success);font-weight:600}
.att-row .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.att-row .ic.warn{background:rgba(251,191,36,.14);color:var(--eleviq-warning)}
.att-row .ic.info{background:rgba(96,165,250,.14);color:var(--eleviq-info)}
.att-row .ic.dang{background:rgba(248,113,113,.14);color:var(--eleviq-danger)}
.att-row .grow{flex:1;min-width:0}
.att-row .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-row .s{font-size:12px;color:var(--eleviq-text-muted)}
.att-row .chev{color:var(--eleviq-text-muted);font-size:12px}
.story{overflow:hidden}
.story .s-head{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;border-bottom:1px solid var(--eleviq-border)}
.story .s-what{flex:1}
.story .s-what .st{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--eleviq-text-muted)}
.story .s-what .num{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.story .s-what .num .up{color:var(--eleviq-success);font-size:1rem;font-weight:600;margin-left:8px}
.story .s-delta{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--eleviq-text-secondary);padding-top:4px}
.story .s-body{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;padding:18px 20px}
.s-trend .lab{font-size:12px;font-weight:600;color:var(--eleviq-text-muted);margin-bottom:10px}
.s-bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.s-bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.s-bars .bar i{width:100%;border-radius:4px 4px 2px 2px;background:var(--eleviq-primary-soft);transform-origin:bottom;animation:growX 600ms var(--ease) backwards;animation-delay:var(--d,0s)}
.s-bars .bar i.cur{background:var(--eleviq-primary);box-shadow:0 0 12px rgba(139,109,245,.35)}
.s-bars .bar em{font-style:normal;font-size:10px;color:var(--eleviq-text-muted);font-variant-numeric:tabular-nums}
.s-why .lab{font-size:12px;font-weight:600;color:var(--eleviq-text-muted);margin-bottom:10px}
.why-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.why-row .nm{width:106px;flex:none;color:var(--eleviq-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why-row .track{flex:1;height:7px;border-radius:4px;background:var(--eleviq-track);overflow:hidden}
.why-row .track i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:growX 700ms var(--ease) backwards;animation-delay:var(--d,0s)}
.why-row .pc{width:46px;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--eleviq-text)}
.s-act{display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--eleviq-border);background:var(--eleviq-primary-soft)}
.s-act .ic{width:26px;height:26px;border-radius:8px;background:var(--eleviq-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.s-act .t{font-size:13px;font-weight:600}
.s-act .s{font-size:12px;color:var(--eleviq-text-secondary)}
.s-drill{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--eleviq-border)}
.ai-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ai-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--eleviq-surface);border:1px solid var(--eleviq-border);font-size:12.5px}
.ai-row .mono{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.ai-row .t{color:var(--eleviq-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-row .pct{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--eleviq-text-muted)}
.ask{margin-top:20px;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--radius-md);border:1px solid var(--eleviq-border);background:var(--eleviq-surface);box-shadow:var(--elev-1)}
.ask .ai{font-size:15px;flex:none}
.ask input{flex:1;background:none;border:0;outline:none;color:var(--eleviq-text);font-size:13.5px;min-width:0}
.ask input::placeholder{color:var(--eleviq-text-muted)}
.ask-reply{margin-top:10px;border-radius:var(--radius-md);border:1px solid var(--eleviq-border);background:var(--eleviq-surface-2);padding:14px 16px;font-size:13px;color:var(--eleviq-text-secondary);display:none}
.ask-reply.show{display:block;animation:fadeUp var(--motion-slow) var(--ease)}
.ask-reply b{color:var(--eleviq-text)}
.ask-reply .tag{display:inline-block;margin:0 4px 0 0;padding:1px 7px;border-radius:var(--radius-full);font-size:10px;font-weight:700;letter-spacing:.04em}
.ask-reply .tag.fact{background:rgba(74,222,128,.14);color:var(--eleviq-success)}
.ask-reply .tag.hypo{background:rgba(96,165,250,.14);color:var(--eleviq-info)}
.ask-reply .tag.rec{background:rgba(139,109,245,.18);color:#B3A0F9}
.x-rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:78px}

.v-org{display:grid;grid-template-columns:236px 1fr 320px;height:100vh;overflow:hidden}

.agent-card{padding:12px 14px;border-radius:var(--radius-sm);background:var(--eleviq-surface-2);border:1px solid var(--eleviq-border);cursor:pointer;transition:border-color var(--motion-base) var(--ease-out),transform var(--motion-fast) var(--ease-out)}
.agent-card:hover{border-color:#333A4C;transform:translateY(-1px)}
.agent-card .a-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.agent-card .amono{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.agent-card .aname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ap-mission{padding:12px 14px;border-radius:var(--radius-sm);background:var(--eleviq-surface);border:1px solid var(--eleviq-border)}

/* ============ VARIANT 3 — MISSION CONTROL ============ */
.v-mission{display:grid;grid-template-columns:236px 1fr 292px;height:100vh;overflow:hidden}

.m-head2 .mtitle{font-size:14.5px;font-weight:600}
.m-head2 .mgoal{font-size:12.5px;color:var(--eleviq-text-secondary);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-head2 .mmeta{text-align:right;flex:none}
.m-head2 .mmeta .pct{font-family:var(--font-mono);font-size:15px;font-weight:700}
.m-head2 .mmeta .eta{font-size:11px;color:var(--eleviq-text-muted)}
.m-head2 .mchev{color:var(--eleviq-text-muted);font-size:13px;transition:transform var(--motion-base) var(--ease)}

.m-prog{padding:0 18px 14px;display:flex;align-items:center;gap:10px}

.m-prog .track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--eleviq-primary),#22D3EE);transform-origin:left;animation:growX 800ms var(--ease) backwards;animation-delay:var(--d,0s)}

.m-stages .stg.done{color:var(--eleviq-success)}

.m-wf{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:0 18px 16px}

.todo{display:flex;flex-direction:column}

function countUp(el,to,o){
  o = o || {};
  var dur = o.dur||600, dec = o.dec||0, pre = o.pre||'', suf = o.suf||'';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !window.requestAnimationFrame){ el.textContent = pre + to.toFixed(dec) + suf; return; }
  var t0 = performance.now();
  function tick(t){
    var p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = pre + (to*e).toFixed(dec) + suf;
    if (p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

    {id:"winback",title:"Customer Win-back Program",goal:"Reactivate 120 churned customers by Sep 30.",status:"planned",prog:0,eta:"not started",d:.15,
      stages:[{label:"Analyze",cls:"",icon:""},{label:"Design",cls:"",icon:""},{label:"Execute",cls:"",icon:""},{label:"Measure",cls:"",icon:""}],
      wf:[{name:"Customer Researcher",mono:"CR",accent:"#8B5CF6"},{name:"Retention Specialist",mono:"RS",accent:"#8B5CF6"},{name:"GrowthOS Commander",mono:"GC",accent:"#EC4899"}],
      todo:[{txt:"Segment churned customers",cls:""},{txt:"Interview 10 churned users",cls:""},{txt:"Design reactivation offer",cls:""},{txt:"Launch program",cls:""}],
      last:["—","Planned · awaiting kickoff","—","—","—","—"]}
  ];
  var wrap = document.getElementById('missionsList');
  wrap.innerHTML = missions.map(missionHTML).join('');
  wrap.querySelectorAll('.mission').forEach(function(m){ m.addEventListener('click', function(e){ if (e.target.closest('[data-approve]')) return; m.classList.toggle('open'); }); });
};

var variants = [vExec, vOrg, vMission];

var stage = document.getElementById('stage');

stage.addEventListener('click', function(e){
  var ap = e.target.closest('[data-approve]');
  if (!ap) return;
  var req = ap.closest('.req');
  if (req){ req.style.opacity = '.35'; req.style.filter = 'grayscale(.6)'; }
  var att = ap.closest('.att-row');
  if (att){ att.classList.add('resolved'); }
  if (ap.closest('.agent-panel') || ap.closest('.mission')){ ap.textContent = '✓ Approved'; ap.disabled = true; ap.style.background = 'var(--eleviq-success)'; }
  var badges = document.querySelectorAll('.badge, [data-badge]');
  badges.forEach(function(b){ var n = parseInt(b.textContent, 10); if (!isNaN(n) && n > 0){ b.textContent = n - 1; } });
  var tag = document.querySelector('.kpi[data-tag]');
  if (tag){ var t = parseInt((tag.getAttribute('data-tag') || '0').match(/\d+/), 10); tag.setAttribute('data-tag', (t > 1 ? t - 1 : 0) + ' awaiting you'); }
});
var picker = document.querySelector('.proto-picker');
var highlight = picker.querySelector('.proto-picker-highlight');
var items = Array.prototype.slice.call(picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)'));
var replay = picker.querySelector('.proto-picker-replay');
var current = 0;
function moveHighlight(){
  var el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function mount(i){
  if (variants[i]._timer) clearInterval(variants[i]._timer);
  stage.innerHTML = '';
  requestAnimationFrame(function(){
    stage.innerHTML = variants[i]();
    if (variants[i].init) variants[i].init();
  });
}
function setActive(i){
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach(function(el, j){
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  var url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach(function(el, i){ el.addEventListener('click', function(){ setActive(i); }); });
replay.addEventListener('click', function(){ mount(current); });
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', function(e){
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(function(){ requestAnimationFrame(function(){ picker.setAttribute('data-ready', ''); }); });

var themeBtn = document.getElementById('themeToggle');
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = 'Theme: ' + (t === 'light' ? 'Light' : 'Dark');
  var u = new URL(location);
  u.searchParams.set('t', t);
  history.replaceState(null, '', u);
}
applyTheme(new URLSearchParams(location.search).get('t') === 'light' ? 'light' : 'dark');
themeBtn.addEventListener('click', function(){
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
});
</script>
</body>
